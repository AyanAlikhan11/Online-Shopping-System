<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><div class="auth"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p class="success" th:if="${param.registered}">Account created. Please log in.</p><p class="error" th:if="${param.error}">Invalid email or password.</p><form th:action="@{/login}" method="post"><label>Email<input name="username" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button">Log in</button></form><p>New here? <a href="/register">Create an account</a></p></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
