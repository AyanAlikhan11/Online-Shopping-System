<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><h1>Your cart</h1><p class="error" th:if="${error}" th:text="${error}"></p><p class="error" th:if="${param.stock}">Requested quantity exceeds available stock.</p><p th:if="${items.empty}">Your cart is empty. <a href="/">Browse products</a>.</p><div th:each="entry:${items}" class="list-row cart-row"><img th:src="${entry.key.firstImage()}" alt=""><div><b th:text="${entry.key.name}"></b><p th:text="'₹'+${entry.key.price}+' each · '+${entry.key.stock}+' available'"></p></div><form th:action="@{/cart/update/{id}(id=${entry.key.id})}" method="post" class="qty-form"><input type="number" name="quantity" min="1" th:max="${entry.key.stock}" th:value="${entry.value}" required><button>Update</button></form><form th:action="@{/cart/remove/{id}(id=${entry.key.id})}" method="post"><button class="secondary">Remove</button></form></div><div th:if="${!items.empty}" class="checkout"><h2 th:text="'Total ₹'+${total}"></h2><p class="muted" th:if="${!livePayment}">Demo checkout records an order without collecting real payment.</p><p class="muted" th:if="${livePayment}">You will complete the payment securely on the next step.</p><form th:action="@{/checkout}" method="post"><label>Delivery address<textarea name="address" required th:text="${address}" placeholder="Street, city, state and PIN code"></textarea></label><button class="button" th:text="${livePayment} ? 'Continue to payment' : 'Place demo order'">Place demo order</button></form></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
