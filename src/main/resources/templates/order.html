<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><a href="/orders" class="muted">← All orders</a><h1 th:text="'Order #'+${order.id}"></h1><p class="badge status-badge" th:text="${order.status}"></p><p th:text="'Payment: '+${order.paymentStatus}"></p><a class="button" th:if="${order.paymentStatus == 'PENDING'}" th:href="@{/pay/{id}(id=${order.id})}">Complete payment</a><section class="tracking-panel" th:if="${!#lists.isEmpty(history)}"><h2>Delivery tracking</h2><div class="tracking"><div class="tracking-step" th:each="h,stat:${history}" th:classappend="${stat.last}?'active':''"><span class="dot"></span><div><b th:text="${#strings.replace(h.status,'_',' ')}"></b><small th:text="${h.createdAt}"></small><p th:if="${h.note != null and !h.note.isBlank()}" th:text="${h.note}"></p></div></div></div></section><p th:if="${#lists.isEmpty(history)}" class="muted" th:text="'Current status: '+${order.status}"></p><p>Delivery to: <b th:text="${order.deliveryAddress}"></b></p><p>Payment reference: <code th:text="${order.paymentReference}"></code></p><div class="list-row" th:each="item:${order.items}"><b th:text="${item.productName}"></b><span th:text="'Qty '+${item.quantity}"></span><span th:text="'₹'+${item.unitPrice}"></span></div><h2 th:text="'Total ₹'+${order.total}"></h2></main><footer>Online Shopping System · Java MVC project</footer></body></html>
