<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure checkout | Shoplane</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><section class="payment-panel"><span class="eyebrow">FINAL STEP</span><h1>Checkout</h1><p th:text="'Order #'+${order.id}"></p><div class="pay-total"><span>Amount due</span><strong th:text="'₹'+${order.total}"></strong></div><p class="error" th:if="${error}" th:text="${error}"></p><p th:if="${livePayment and order.gatewayOrderId != null}" class="muted">Complete the payment in Razorpay Checkout. Your order is confirmed after server verification.</p><p th:unless="${livePayment}" class="muted">Demo mode: no money is charged. Use this to test the full shopping flow.</p><form th:unless="${livePayment}" th:action="@{/pay/{id}/demo(id=${order.id})}" method="post"><button class="button">Confirm demo payment</button></form><button th:if="${livePayment and order.gatewayOrderId != null}" class="button" id="payButton" type="button">Pay securely</button><form id="verifyForm" th:if="${livePayment and order.gatewayOrderId != null}" th:action="@{/pay/{id}/verify(id=${order.id})}" method="post"><input type="hidden" name="razorpay_payment_id" id="paymentId"><input type="hidden" name="razorpay_order_id" id="gatewayOrder"><input type="hidden" name="razorpay_signature" id="signature"></form><form th:action="@{/pay/{id}/cancel(id=${order.id})}" method="post"><button type="submit" class="secondary">Cancel order</button></form><p id="payError" class="error" role="alert"></p></section></main><footer>Online Shopping System · Java MVC project</footer><script th:if="${livePayment and order.gatewayOrderId != null}" src="https://checkout.razorpay.com/v1/checkout.js"></script><script th:if="${livePayment and order.gatewayOrderId != null}" th:inline="javascript">/*<![CDATA[*/
const settings={key:/*[[${keyId}]]*/'',amount:/*[[${order.total.movePointRight(2).longValueExact()}]]*/0,currency:'INR',name:'Shoplane',description:'Order payment',order_id:/*[[${order.gatewayOrderId}]]*/'',handler:function(response){document.getElementById('paymentId').value=response.razorpay_payment_id;document.getElementById('gatewayOrder').value=response.razorpay_order_id;document.getElementById('signature').value=response.razorpay_signature;document.getElementById('verifyForm').submit();}};
document.getElementById('payButton').addEventListener('click',()=>{if(typeof Razorpay==='undefined'){document.getElementById('payError').textContent='Payment checkout could not load. Please try again.';return;}new Razorpay(settings).open();});
/*]]>*/</script></body></html>
