<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My orders</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><h1>My orders</h1><p th:if="${orders.empty}">No orders yet.</p><a class="list-row order-link" th:each="o:${orders}" th:href="@{/orders/{id}(id=${o.id})}"><b th:text="'Order #'+${o.id}"></b><span th:text="${o.createdAt}"></span><span class="badge" th:text="${o.status}"></span><strong th:text="'₹'+${o.total}"></strong></a></main><footer>Online Shopping System · Java MVC project</footer></body></html>
