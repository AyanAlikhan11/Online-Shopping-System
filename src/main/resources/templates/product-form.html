<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit product</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><div class="auth wide"><h1 th:text="${product.id == null}?'Add product':'Edit product'"></h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/admin/products}" method="post" enctype="multipart/form-data"><input type="hidden" name="id" th:value="${product.id}"><label>Name<input name="name" th:value="${product.name}" required></label><label>Description<textarea name="description" th:text="${product.description}"></textarea></label><div class="two"><label>Category<input name="category" th:value="${product.category}"></label><label>Type<input name="type" th:value="${product.type}"></label><label>Size<input name="size" th:value="${product.size}"></label><label>Color<input name="color" th:value="${product.color}"></label><label>Price ₹<input type="number" name="price" min="0" step="0.01" th:value="${product.price}" required></label><label>Stock<input type="number" name="stock" min="0" th:value="${product.stock}" required></label></div><label>Image URLs, separated by commas or new lines<textarea name="imageUrls" th:text="${product.imageUrls}"></textarea></label><div class="image-preview" th:if="${product.id != null}"><img th:each="img:${product.images()}" th:src="${img}" alt="Current product image"></div><label>Upload images (JPEG, PNG, WebP or GIF, up to 5 MB each)<input type="file" name="imageFiles" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><button class="button">Save product</button></form><p><a href="/admin">← Back to dashboard</a></p></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
