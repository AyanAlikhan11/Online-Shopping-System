<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorites</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><h1>Favorites</h1><p th:if="${favorites.empty}">Nothing saved yet. <a href="/">Browse products</a>.</p><div class="grid"><article th:each="f:${favorites}" class="card"><a th:href="@{/products/{id}(id=${f.product.id})}"><img th:src="${f.product.firstImage()}" alt=""><div class="card-info"><h3 th:text="${f.product.name}"></h3><strong th:text="'₹'+${f.product.price}"></strong></div></a></article></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
