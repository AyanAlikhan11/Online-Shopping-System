<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><div class="section-title"><div><div class="eyebrow">MANAGEMENT</div><h1>Admin dashboard</h1></div><a class="button" href="/admin/products/new">+ Add product</a></div><h2>Products</h2><div class="list-row" th:each="p:${products}"><b th:text="${p.name}"></b><span th:text="'₹'+${p.price}+' · '+${p.stock}+' in stock'"></span><a th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a><form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this product?')"><button class="secondary">Delete</button></form></div><h2>Orders & delivery</h2><div class="list-row admin-order" th:each="o:${orders}"><a th:href="@{/orders/{id}(id=${o.id})}" th:text="'Order #'+${o.id}"></a><span th:text="${o.customer.email}"></span><b th:text="'₹'+${o.total}"></b><span class="badge" th:text="${o.paymentStatus}"></span><span class="badge status-badge" th:text="${o.status}"></span><form th:if="${o.paymentStatus == 'PAID'}" th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="status-form"><select name="status"><option th:each="s:${deliveryStatuses}" th:value="${s}" th:text="${s}" th:selected="${s == o.status}"></option></select><input name="note" placeholder="Delivery note (optional)"><button>Update</button></form></div><h2>Registered customers</h2><div class="list-row" th:each="c:${customers}"><b th:text="${c.name}"></b><span th:text="${c.email}"></span><span class="badge" th:classappend="${(c.active == null or c.active) ? '' : 'badge-off'}" th:text="${(c.active == null or c.active) ? 'ACTIVE' : 'DISABLED'}"></span><a th:href="@{/admin/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/admin/customers/{id}/toggle(id=${c.id})}" method="post"><button class="secondary" th:text="${(c.active == null or c.active) ? 'Disable' : 'Enable'}">Disable</button></form><form th:action="@{/admin/customers/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this customer if they have no orders?')"><button class="secondary">Delete</button></form></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
