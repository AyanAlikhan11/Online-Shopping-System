<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoplane | Discover</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><section class="hero"><div><div class="eyebrow">CURATED FOR EVERYDAY LIFE</div><h1>Find something<br><em>worth keeping.</em></h1><p>Browse the collection, compare details, and shop with ease.</p><a class="button" href="#catalog">Explore products →</a></div><div class="hero-art">NEW<br>SEASON<span>✳</span></div></section><section id="catalog"><div class="section-title"><div><div class="eyebrow">THE COLLECTION</div><h2>Discover products</h2></div><span th:text="${products.size()}+' items'">0 items</span></div><form class="filters" action="/" method="get"><input name="q" placeholder="Search products or descriptions" th:value="${param.q}"><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c}" th:text="${c}" th:selected="${param.category != null and param.category[0] == c}"></option></select><select name="type"><option value="">All types</option><option th:each="t:${types}" th:value="${t}" th:text="${t}" th:selected="${param.type != null and param.type[0] == t}"></option></select><select name="size"><option value="">All sizes</option><option th:each="s:${sizes}" th:value="${s}" th:text="${s}" th:selected="${param.size != null and param.size[0] == s}"></option></select><select name="color"><option value="">All colors</option><option th:each="c:${colors}" th:value="${c}" th:text="${c}" th:selected="${param.color != null and param.color[0] == c}"></option></select><input type="number" name="min" min="0" placeholder="Min ₹" th:value="${param.min}"><input type="number" name="max" min="0" placeholder="Max ₹" th:value="${param.max}"><button>Search</button><a class="filter-clear" href="/">Clear</a></form><div class="grid"><article class="card" th:each="p:${products}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.firstImage()}" th:alt="${p.name}"></a><div class="card-info"><small th:text="${p.category}+' · '+${p.color}"></small><h3 th:text="${p.name}"></h3><div class="row"><strong th:text="'₹'+${p.price}"></strong><a th:href="@{/products/{id}(id=${p.id})}">View details →</a></div></div></article></div><p th:if="${products.empty}" class="empty">No products match these filters.</p></section></main><footer>Online Shopping System · Java MVC project</footer></body></html>
