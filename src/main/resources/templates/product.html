<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product details</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><a href="/" class="muted">← Back to products</a><section class="detail"><div><img class="main-image" id="mainImage" th:src="${product.firstImage()}" th:alt="${product.name}" onclick="this.classList.toggle('zoom')"><div class="thumbs"><button type="button" th:each="img:${product.images()}" th:attr="data-image=${img}" class="thumb-button"><img th:src="${img}" alt="Product angle"></button></div><p class="muted">Click the large photo to enlarge it.</p></div><div class="detail-copy"><div class="eyebrow" th:text="${product.category}+' / '+${product.type}"></div><h1 th:text="${product.name}"></h1><p class="price" th:text="'₹'+${product.price}"></p><p th:text="${product.description}"></p><div class="spec"><span>Size <b th:text="${product.size}"></b></span><span>Color <b th:text="${product.color}"></b></span><span>In stock <b th:text="${product.stock}"></b></span></div><p class="error" th:if="${param.stock}">Requested quantity exceeds available stock.</p><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><label>Quantity <input type="number" name="quantity" min="1" th:max="${product.stock}" value="1" required></label><button class="button" th:disabled="${product.stock == 0}">Add to cart</button></form><form th:action="@{/favorites/{id}(id=${product.id})}" method="post"><button class="secondary">♡ Add / remove favorite</button></form></div></section></main><footer>Online Shopping System · Java MVC project</footer><script>document.querySelectorAll(".thumb-button").forEach(button=>button.addEventListener("click",()=>{document.getElementById("mainImage").src=button.dataset.image;document.querySelectorAll(".thumb-button").forEach(b=>b.classList.remove("active"));button.classList.add("active")}));</script></body></html>
