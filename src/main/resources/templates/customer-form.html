<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit customer</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{nav :: bar}"></header><main class="container"><div class="auth wide"><div class="eyebrow">CUSTOMER MANAGEMENT</div><h1>Edit customer</h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/admin/customers/{id}(id=${customer.id})}" method="post"><label>Name<input name="name" th:value="${customer.name}" required></label><label>Email<input name="email" type="email" th:value="${customer.email}" required></label><label>Delivery address<textarea name="address" th:text="${customer.address}" placeholder="Street, city, state and PIN code"></textarea></label><label class="check"><input type="checkbox" name="active" value="true" th:checked="${customer.active == null or customer.active}"> Account active (customers cannot log in when disabled)</label><button class="button">Save customer</button></form><p><a href="/admin">← Back to dashboard</a></p></div></main><footer>Online Shopping System · Java MVC project</footer></body></html>
