# Database Configuration
# Default: Active H2 file database (zero-configuration, runs immediately without needing external MySQL server)
# To switch to local MySQL, start MySQL on port 3306 and set SPRING_PROFILES_ACTIVE=mysql (or run: mvn spring-boot:run -Dspring-boot.run.profiles=mysql)

spring.datasource.url=jdbc:h2:file:./data/shopdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf & Web
spring.thymeleaf.cache=false
server.error.include-message=always
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Admin Credentials & Initial Setup
app.admin.email=${ADMIN_EMAIL:admin@shop.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# Mail Configuration
app.mail.from=${MAIL_FROM:no-reply@shop.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Payment & File Uploads
app.payment.mode=${PAYMENT_MODE:demo}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads}

# Management & Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false
spring.flyway.enabled=false
